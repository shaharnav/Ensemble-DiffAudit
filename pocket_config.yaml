note: Determined by ligand transfer from a papain-family holo structure, not by geometric
  cavity detection -- Xylellain's site is occluded even in R2, so a cavity finder
  would likely miss it. Box center is E-64's whole-heavy-atom transferred centroid,
  not the catalytic dyad, so the S1/S2/S3 subsites are not truncated. Every downstream
  stage (Vina docking, DiffSBDD pocket conditioning) must read center/box from this
  file, never recompute it.
