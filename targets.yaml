pilot_target:
  name: "Cellular retinol-binding protein 1 (CRBP1)"
  organism: Homo sapiens
  apo:
    pdb_id: 5H9A
    chain: A
    ligand_present: false
    cofactor_present: false
    note: >
      Only heteroatom is BTB (Bis-Tris buffer, a crystallization additive, not a
      cofactor). 139/140 residues modeled, no gaps.
  holo:
    pdb_id: 6E5L
    chain: A
    ligand_code: HVD
    ligand_name: "(1'R,2'R)-5'-methyl-6-pentyl-2'-(prop-1-en-2-yl)-1',2',3',4'-tetrahydro[1,1'-biphenyl]-2,4-diol (abnormal-cannabidiol, abn-CBD)"
    ligand_smiles: "CCCCCc1cc(cc(c1C2C=C(CCC2C(=C)C)C)O)O"
    ligand_mw: 314.462
    cofactor_present: false
    other_heteroatoms: []
    note: "140/140 residues modeled, no gaps."
  sequence_identity: "Identical 140-residue construct in both entries (verified via RCSB polymer_entity), same organism, no mutations, no gaps in either model."
  mechanism: >
    Portal-loop opening: the beta-barrel entryway loop around residues 76-77 swings open
    on ligand binding (max single-residue CA displacement 6.22 A at holo residue 76;
    every other pocket-lining residue moves < 1.1 A except residue 77 at 2.04 A) --
    a localized backbone motion, not a global rearrangement (global CA RMSD 1.15 A vs.
    pocket CA RMSD 1.57 A). CA-to-allatom pocket RMSD ratio 0.947, the highest of any
    qualifying pair in the screen -- strongly backbone-driven, well-suited to a
    backbone-sampling method like ConforMix/Boltz.
  selection_method: >
    Selected by target_screen.py (Phase 1b) as the top-ranked qualifying pair (highest
    CA-to-allatom ratio inside the 1.0-2.5 A pocket CA RMSD band, no cofactor
    difference) out of 43 PocketMiner apo/holo pairs. See target_screen.csv for the full
    screen output and PREREGISTRATION.md for the fixed screening criteria.

new_target_lfrr:
  name: "LfrR (TetR-family transcriptional regulator)"
  organism: Mycobacterium smegmatis
  apo:
    pdb_id: 2WGB
    chain: A
    resolution_A: 2.0
    ligand_present: false
    cofactor_present: false
    note: >
      Only heteroatoms are HOH and SO4 (sulfate, a crystallization additive on the
      standard blocklist, not a cofactor).
  holo:
    pdb_id: 2V57
    chain: A
    resolution_A: 1.9
    ligand_code: PRL
    ligand_name: Proflavine
    ligand_mw: 209.247
    cofactor_present: false
    other_heteroatoms: [HOH, IPA, SO4]
    note: >
      IPA (isopropanol) and SO4 are both on the standard crystallization-additive
      blocklist; PRL is the only non-blocklisted heteroatom distinguishing holo from
      apo. Structure contains two dimer copies of PRL (chains A and C); confirmed the
      chain-A-associated copy (residue 1188) is the one used for the chain-A pocket
      analysis below, not the chain-C copy.
  sequence_identity: "Same UniProt accession (Q58L87) in both entries; only 2 PDB depositions exist for this accession, so 2WGB is trivially the sole (and thus highest-resolution) apo entry per the apo-selection rule."
  mechanism: >
    Access-shell pocket CA RMSD 4.58 A (81.4% DSSP-structured), global CA RMSD 4.51 A --
    a domain-scale, structured reorientation rather than a small local lid closure.
    Contact residues span 67-152 (13 contact / 40 access-shell residues), with the
    largest per-residue displacement (8-13 A) concentrated at residues 104-127. This is
    a different motion type than the CRBP1 pilot's localized portal-loop closure --
    closer to the literature-documented TetR-family "pendulum" mechanism, where the
    DNA-binding domain reorients relative to the ligand-binding regulatory domain upon
    effector binding. The moving region is well-structured (81% H/E, not a disordered
    loop), which rules out the Xylellain failure mode (a 16.7%-structured propeptide
    flailing 24-177 A) -- but whether ConforMix's local-perturbation sampling can reach
    a domain-scale (if structured) motion, rather than just a loop/lid, is an open
    question Phase 4 smoke-testing should resolve, not something assumed here.
  selection_method: >
    Only new target to clear all 6 pre-registered gates (GATE_DEFINITION_PREREGISTRATION.md)
    across ~30 apo/holo candidates screened: the 43-usable-pair PocketMiner/CryptoSite pool
    (cryptic_pocket_screen.py) plus ~21 hand-picked literature candidates spanning
    TetR-family regulators, a cytokine PPI hot spot, a phosphatase allosteric site, a
    kinase DFG-out pocket, and a viral polymerase's allosteric sites. Full trail in
    NEW_TARGET_SCREEN_RESULTS.md and results/target_screen/new_target_screen_final.csv.
    Audited before staging: the pocket/global RMSD ratio (1.01) was checked against the
    other 8 pairs that pass the same structural gates in this screen (range 0.72-1.44)
    and found unremarkable, not an outlier -- an initial instinct to reject on that
    ratio alone (by analogy to CRBP1's higher 1.37 ratio) was an unwritten, retroactive
    criterion, not a pre-registered gate, and was not applied.

target_swap_history:
  - candidate: "DHFR, apo 2W9T / holo 2W9S"
    outcome: rejected before any run
    reason: >
      2W9S carries NADPH in addition to the trimethoprim inhibitor; 2W9T carries neither.
      The DHFR loop motion (Met20 loop) that PocketMiner flags for this pair closes over
      NADPH's nicotinamide ring and is cofactor-driven, not inhibitor-driven. An
      apo-conditioned sampler that never sees the cofactor could not reach that
      conformation regardless of whether the underlying generative method works, which
      makes a null result on this pair uninterpretable. Documenting this as a confound
      was not sufficient because it supplies an alternative explanation for the pilot's
      primary finding, not just added noise. Separately confirmed by target_screen.py:
      pocket CA RMSD 2.64 A (via the original single-pair script) exceeds the 2.0 A
      ConforMix sampling shell, so the holo state may have been out of reach by
      construction as well.
  - candidate: "Ricin A chain, apo 1RTC / holo 1BR6"
    outcome: rejected before any run
    reason: >
      Cofactor-free and otherwise clean (same 268-residue construct, no mutations, no
      gaps), but the mechanism is a Tyr80 sidechain swing: pocket CA RMSD 0.38 A against
      all-atom 1.05 A (ratio 0.36). ConforMix/Boltz sampling is backbone-driven, so a
      null result would be ambiguous between H2 (mode collapse) and "wrong tool for this
      motion type" -- indistinguishable, same defect class as the DHFR rejection, just
      via a different mechanism (sampler/motion-type mismatch instead of an unmodeled
      cofactor).
  - candidate: "LpqN, apo 6E5D / holo 6E5F (suggested backup, never formally proposed as primary)"
    outcome: excluded by the Phase 1b screen
    reason: >
      Checked automatically as part of the 43-pair screen rather than hand-verified:
      pocket CA RMSD 0.56 A (below the 1.0 A floor -- displacement barely clears
      trypsin's ~0.2 A noise level) and CA-to-allatom ratio 0.49 (sidechain-gated, the
      same failure mode as ricin). Would have needed the same rejection as ricin had it
      been checked by hand; the systematic screen caught it without that step.
  - candidate: "CRBP1, apo 5H9A / holo 6E5L"
    outcome: selected
    reason: >
      Top-ranked qualifying pair from the Phase 1b screen: pocket CA RMSD 1.57 A (inside
      the 1.0-2.5 A band), CA-to-allatom ratio 0.947 (the highest of any qualifying
      pair -- strongly backbone-driven), no cofactor difference (apo's only heteroatom is
      a crystallization buffer component, not a cofactor), drug-like holo ligand (abn-CBD,
      MW 314.5), small tractable single-chain construct (140 residues). Manually verified
      against RCSB per Phase 1a criteria before finalizing.
