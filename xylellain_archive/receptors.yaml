target:
  name: Xylellain
  organism: "Xylella fastidiosa (strain 9a5c)"
  pdb_id: 3OIS
  resolution_angstrom: 1.65
  reference: "Leite et al., FEBS Lett 2013 (PMID 23333295)"
  disease_context: >
    Causal agent of Pierce's disease of grapevine, almond leaf scorch, and citrus
    variegated chlorosis -- all currently untreatable. Cited as motivation, not as a claim
    about any compound generated in this experiment.
  chain_used: A
  note: >
    4 crystallographically independent copies (chains A-D) in the asymmetric unit; chain A
    used throughout, consistent with the single-chain-receptor convention used in
    Experiments 1 and 2.

verification:
  script: verify_3ois.py
  output: results/experiment3/verification_3ois.json
  hetatm_inventory:
    UDP: 1  # per chain; 930 waters excluded
  ribonucleotide:
    code: UDP
    name: "Uridine-5'-diphosphate"
    centroid_distance_to_active_site_A: 24.81
    closest_atom_to_catalytic_cys_sg_A: 19.98
    gate_threshold_A: 8.0
    gate_result: PASS
    conclusion: "UDP is peripheral. Active site is apo, consistent with the paper's own abstract ('ribonucleotide bound outside the active site')."
  catalytic_triad:
    cys: 78
    his: 237
    asn: 255
    evidence: "Cys78 SG - His237 NE2: 4.45 A. His237 ND1 - Asn255 OD1: 3.58 A. Both within standard H-bond/ion-pair range for a papain-family triad."
  propeptide_boundary:
    range: [23, 66]
    mature_domain_range: [67, 290]
    evidence: >
      Per-residue minimum distance to the active-site centroid, residues N-terminal to
      Cys78: an occluding loop at residues 26-36 (3.9-9.8 A, directly blocking the site),
      then residues 37-66 sit far from the site (12-31 A) -- still N-terminal and
      contiguous, but not physically occluding -- before the conserved mature-domain motif
      immediately preceding the catalytic Cys (residues 67-78, "...QGRIGSC...") re-approaches
      the site as part of the substrate-binding cleft itself, not propeptide. This matches
      the paper's abstract ("part of the N-terminal sequence blocks the active site," not
      a claim that the full propeptide uniformly occludes it) rather than assuming the
      full ~56-residue propeptide length from the abstract wholesale.
      Deleting residues 23-66 removes the full contiguous N-terminal segment including the
      occluding loop; residues 37-66, though not directly occluding, are part of the same
      unbroken propeptide sequence and would leave a biologically nonsensical dangling
      subdomain if only the occluding loop (26-36) were trimmed.

receptors:
  R1_zymogen:
    path: results/experiment3/receptors/R1_zymogen.pdb
    residue_range: [23, 290]
    n_residues: 268
    description: "3OIS as deposited, chain A, waters and UDP removed, propeptide retained. The only experimentally observed state -- floor."
  R2_mature_proxy:
    path: results/experiment3/receptors/R2_mature_proxy.pdb
    residue_range: [67, 290]
    n_residues: 224
    description: >
      Propeptide (residues 23-66) deleted from R1. Not remodeled, minimized, or relaxed.
      No explicit N-terminal cap added -- residue 67 (Phe) is prepared identically to any
      other receptor's terminus by this pipeline's existing Meeko-based receptor prep.
    limitation: >
      The real mature enzyme, after propeptide cleavage, may relax into a conformation
      different from "zymogen minus propeptide." R2 is a proxy for the open state, not a
      measured structure. It supplies a reference ceiling where no crystallographic one
      exists, and every number derived from it (opening_recovery, Phase 7) inherits this
      assumption.

docking_box:
  superseded_by: pocket_config.yaml
  note: >
    The cavity-detection-based box below (pocket_volume.py, centered on the catalytic-triad
    centroid) was superseded: Xylellain's site is occluded even in R2, so a geometric
    approach risked finding a surface depression rather than the true substrate groove.
    Replaced with ligand transfer from papain-family holo structures (pocket_config.py) --
    see pocket_config.yaml for the authoritative center/box, alignment diagnostics, and
    validation. Every downstream stage (Vina docking, DiffSBDD pocket conditioning) reads
    from pocket_config.yaml, never recomputes it.
  previous_geometric_box:
    script: pocket_volume.py
    center: [57.345333099365234, 23.142000198364258, -23.40033531188965]
    size_A: [24.0, 24.0, 24.0]
    defined_from: "R2 catalytic-triad centroid (Cys78 SG, His237 NE2, Asn255 OD1)."

pocket_volume:
  script: pocket_volume.py
  output: results/experiment3/pocket_volume.json
  center_source: pocket_config.yaml
  note: >
    Recomputed after pocket_config.py replaced the box definition (ligand transfer from
    papain-family holo structures, not geometric cavity detection). Center moved from the
    catalytic-triad centroid (used below, superseded) to pocket_config.yaml's
    ligand-transfer centroid -- the sphere now sits over the actual substrate groove
    rather than just the dyad, which is why both volumes and the opening are larger than
    the superseded numbers.
  method: >
    Grid-based proxy (fpocket not available in this environment: not on PATH, not in
    Homebrew). 0.5 A grid spacing, 10 A sphere around the active-site centroid,
    cavity_volume_A3 = total non-clashing grid volume (>1.4 A from every receptor heavy
    atom) within that sphere. This is coarser than true SASA-based cavity detection (no
    flood-fill enclosure test) -- used only for relative R1/R2/conformer comparison under
    the identical sphere, not as an absolute physical cavity volume.
  R1_zymogen_A3: 2678.0
  R2_mature_proxy_A3: 3243.4
  opening_A3: 565.4
  gate_threshold_A3: 150
  gate_result: "PASS (both R1 and R2 well above threshold)"
  superseded_numbers_triad_centered:
    R1_zymogen_A3: 2454.2
    R2_mature_proxy_A3: 2744.5
    opening_A3: 290.3
